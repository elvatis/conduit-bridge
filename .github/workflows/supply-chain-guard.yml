name: Supply Chain Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the scanner to the reviewed v6 branch tip. Updating this SHA is an
      # explicit maintenance action, so a tag move cannot silently change CI.
      - uses: homeofe/supply-chain-guard@0dedc46c8f1e2828918823a813bf91d7909d6943 # v6 / 2026-09-07
        with:
          fail-on: critical
          comment-on-pr: true
