# Secret Scan - credential-leak tripwire for a PUBLIC repo.
#
# conduit-bridge is public and brokers several paid AI APIs, so one committed key
# is a live credential leak. The existing checks do not cover this: supply-chain-guard
# audits dependencies, CodeQL audits code, and GitHub-native secret scanning /
# push protection are currently DISABLED on this repository.
#
# `.gitignore` keeps `.env` out of a commit; this job is the backstop for a key
# pasted into a README, a test fixture or a config file. It runs the repo's own
# dependency-free scanner (scripts/scan-secrets.mjs) over the tracked tree AND
# over every blob in git history, so a key that was added and then removed in a
# later commit of the same pull request is still caught.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the scanner can inspect every blob, not just the tip.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Scan tracked files and full git history
        run: node scripts/scan-secrets.mjs --history
