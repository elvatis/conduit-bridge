# Test suite - typecheck, unit tests, and a build of the shipped bundle.
#
# Until this existed, nothing in CI ran the tests: aahp-verify, CodeQL and the
# scanners were the whole gate, so a change could go green with a failing suite.
#
# It runs on Linux because the suite is ~1s there and minutes on Windows, but the
# bridge's subprocess layer is Windows-specific (cmd.exe command-line truncation,
# PATHEXT resolution, CreateProcess argv limits), so the Windows job guards the
# platform the maintainers actually run. Both are cheap; the matrix keeps the
# cross-platform helpers (argvLimitFor, findMultilineArg, sandboxCwd) honest.
#
# The build step is not redundant with typecheck: `npm run build` runs
# `tsc --noEmit` AND both esbuild bundles, so it catches a module that type-checks
# but cannot be bundled - which is what actually ships, since the global install
# symlinks into the workspace and serves dist/.

name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push to the same ref supersedes this run; never cancel main.
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build the shipped bundle
        run: npm run build
