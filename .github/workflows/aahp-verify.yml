# AAHP Verify - the intended REQUIRED status check for the handoff gate.
#
# Runs the pinned AAHP CLI (`aahp verify --level ci`), which executes all 4 layers
# with NO escape hatch (AAHP_SKIP_VERIFY is ignored at --level ci). This is the
# off-machine, non-bypassable backstop behind the local pre-commit / pre-push hooks:
#   Layer 1: MANIFEST checksum integrity
#   Layer 2: content-drift gate (code changed => STATUS.md + MANIFEST.json must change)
#   Layer 3: commit-pointer freshness
#   Layer 4: TRUST-TTL expiry (advisory)
# The follow-up `aahp doctor --json` prints the 6-gate conformance record.
#
# The CLI is consumed via `npx --no-install aahp`, resolving the exact version
# pinned in devDependencies (@elvatis_com/aahp), installed by `npm ci`. This
# repo no longer vendors the AAHP bash scripts; the pinned package owns them.
#
# No exemptions. Every step below runs unconditionally.
#
# There used to be a Dependabot carve-out: the job stayed a REQUIRED check but
# no-opped to success for dependabot[bot], on both the PR (github.actor) and the
# push to main (head_commit.author). The reasoning was that a dependency bump
# introduces no handoff-state change. That is true of the handoff layers and
# false of everything else the gate covers, and a required check that reports
# success without looking is worse than an absent one, because the branch
# protection UI shows it as green.
#
# aahp doctor agrees: with the conditionals present it classified this gate as
# bypassable, so `verifyWorkflow.enforce: true` in aahp.config.json fails while
# any of them remain.
name: AAHP Verify

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Exact base commit SHA for the Layer 2 diff
        required: true
        type: string

jobs:
  aahp-verify:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so the content-drift gate can diff against the base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (pinned AAHP CLI)
        run: npm ci --ignore-scripts

      - name: Run aahp verify (CI level, no escape hatch)
        run: npx --no-install aahp verify . --level ci
        env:
          AAHP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}

      # The governance gates: changelog presence and format, version-sync against
      # every documented site, forbidden-patterns and doc-links. None of these ran
      # in CI before, so documentation could contradict package.json and the em-dash
      # ban could accumulate 51 violations, both with a green build.
      - name: Run aahp check (governance gates)
        run: npx --no-install aahp check .

      - name: Print aahp doctor conformance record
        run: npx --no-install aahp doctor . --json
