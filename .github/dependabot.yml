version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # supply-chain-guard is consumed from the rolling major tag @v5.
      # Its daily threat-intel routine ships new IOCs as new releases, so
      # @v5 is how new indicators reach this repo. An exact-version pin
      # freezes the indicator set and silently stops new threat intelligence
      # (estate lesson: elvatis-sso Dependabot PR that pinned to v5.23.5).
      # Do not remove this ignore without reading .ai/handoff/STATUS.md.
      - dependency-name: "homeofe/supply-chain-guard"
